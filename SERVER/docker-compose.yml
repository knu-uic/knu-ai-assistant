# docker-compose.yml
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: knu-uic-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-knu-uic}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-knu-uic}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-knu-uic} -d ${DB_NAME:-knu-uic}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bot_network

  app:
    build: .
    container_name: knu-uic-app
    restart: always
    ports:
      - "8501:8501"
    env_file:
      - .env  # .env의 모든 변수들을 자동으로 컨테이너 환경변수로 로드
    environment:
      # 컨테이너 안에서는 DB 호스트가 'db'(compose 네트워크). .env는 네이티브
      # 개발용 local이라, 컨테이너 실행 시에만 docker로 덮어쓴다(load_dotenv는
      # override=False라 이 OS env가 우선).
      RUNTIME_ENV: docker
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy   # pg_isready 통과 후에만 app 기동
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bot_network

  redis:
    image: redis:7-alpine
    container_name: knu-uic-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - bot_network

volumes:
  pgdata:
  hf_cache:

networks:
  bot_network:
    driver: bridge
