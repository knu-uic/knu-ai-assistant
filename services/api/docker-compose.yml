# docker-compose.yml
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: knu-uic-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-knu-uic}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-knu-uic}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-knu-uic} -d ${DB_NAME:-knu-uic}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bot_network

  redis:
    image: redis:7-alpine
    container_name: knu-uic-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - bot_network

volumes:
  pgdata:

networks:
  bot_network:
    driver: bridge
