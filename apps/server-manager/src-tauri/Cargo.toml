[package]
name = "knu-server-manager"
version = "0.1.0"
description = "Independent desktop manager for the KNU plugin server"
edition = "2021"

[lib]
name = "knu_server_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
