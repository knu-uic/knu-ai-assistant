name: KNU Server Manager release

on:
  workflow_dispatch:
  push:
    tags:
      - "knu-server-v*"

permissions:
  contents: write

jobs:
  macos-standalone:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server-manager/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v6

      - name: Install manager build dependencies
        run: npm ci
        working-directory: apps/server-manager

      - name: Build relocatable database runtimes
        id: native
        shell: bash
        run: |
          platform="$(uname -s | tr '[:upper:]' '[:lower:]')"
          architecture="$(uname -m)"
          output="$RUNNER_TEMP/knu-native-$platform-$architecture"
          bash apps/server-manager/scripts/build-native-runtime.sh "$output"
          echo "postgres=$output/postgres" >> "$GITHUB_OUTPUT"
          echo "redis=$output/redis" >> "$GITHUB_OUTPUT"
          echo "java=$output/java" >> "$GITHUB_OUTPUT"
          echo "platform=$platform-$architecture" >> "$GITHUB_OUTPUT"
      - name: Test manager and extraction boundaries
        run: npm run check
        working-directory: apps/server-manager

      - name: Build standalone installer
        run: npm run bundle
        working-directory: apps/server-manager
        env:
          KNU_POSTGRES_RUNTIME: ${{ steps.native.outputs.postgres }}
          KNU_REDIS_RUNTIME: ${{ steps.native.outputs.redis }}
          KNU_JAVA_RUNTIME: ${{ steps.native.outputs.java }}

      - uses: actions/upload-artifact@v4
        with:
          name: knu-server-manager-${{ steps.native.outputs.platform }}
          path: apps/server-manager/src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/knu-server-v')
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes
          find apps/server-manager/src-tauri/target/release/bundle -type f \
            -exec gh release upload "$GITHUB_REF_NAME" {} +
        env:
          GH_TOKEN: ${{ github.token }}
